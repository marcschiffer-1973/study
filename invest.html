<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>🌸 投资看板</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#e91e8c" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink:       #e91e8c;
      --pink-dark:  #c2185b;
      --pink-light: #fce4ec;
      --pink-mid:   #f48fb1;
      --bg:         #fff0f5;
      --card:       #ffffff;
      --text:       #2d1b25;
      --muted:      #9e6e83;
      --up:         #e53935;
      --down:       #43a047;
      --radius:     14px;
      --shadow:     0 4px 20px rgba(233,30,140,.10);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
    }

    /* ── Gate ── */
    #gate {
      position: fixed; inset: 0; z-index: 999;
      background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 40%, #f48fb1 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 2rem;
    }
    .gate-card {
      background: #fff; border-radius: 24px; padding: 2.5rem 2rem;
      width: 100%; max-width: 340px;
      box-shadow: 0 8px 40px rgba(233,30,140,.25); text-align: center;
    }
    .gate-icon  { font-size: 3rem; margin-bottom: .8rem; }
    .gate-title { font-size: 1.4rem; font-weight: 700; color: var(--pink-dark); margin-bottom: .4rem; }
    .gate-sub   { font-size: .85rem; color: var(--muted); margin-bottom: 1.6rem; }
    .gate-input {
      width: 100%; padding: .75rem 1rem;
      border: 2px solid var(--pink-mid); border-radius: 10px;
      font-size: 1.2rem; text-align: center; letter-spacing: .3em;
      outline: none; color: var(--text); transition: border-color .2s;
    }
    .gate-input:focus { border-color: var(--pink); }
    .gate-input.shake { animation: shake .4s; border-color: #e53935; }
    @keyframes shake {
      0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)}
      40%{transform:translateX(6px)}   60%{transform:translateX(-4px)}
      80%{transform:translateX(4px)}
    }
    .gate-btn {
      margin-top: 1rem; width: 100%; padding: .85rem; border: none;
      border-radius: 10px; font-size: 1rem; font-weight: 700;
      background: linear-gradient(135deg, var(--pink), var(--pink-dark));
      color: #fff; cursor: pointer; transition: opacity .2s, transform .1s;
    }
    .gate-btn:active { transform: scale(.97); }
    .gate-err { color: #e53935; font-size: .82rem; margin-top: .6rem; min-height: 1.2em; }

    /* ── App ── */
    #app { display: none; }

    header {
      background: linear-gradient(135deg, var(--pink), var(--pink-dark));
      color: #fff; padding: 1rem 1.2rem;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 50;
      box-shadow: 0 2px 12px rgba(233,30,140,.3);
    }
    .header-left { display: flex; align-items: center; gap: .5rem; }
    .header-title { font-size: 1.05rem; font-weight: 700; }
    .header-right { display: flex; align-items: center; gap: .6rem; }
    .btn-sm {
      padding: .35rem .75rem; border-radius: 8px; border: none;
      font-size: .8rem; font-weight: 600; cursor: pointer;
      transition: opacity .2s, transform .1s;
    }
    .btn-sm:active { transform: scale(.95); }
    .btn-refresh { background: rgba(255,255,255,.25); color: #fff; }
    .btn-logout  { background: rgba(255,255,255,.15); color: #fff; }

    /* ── Status bar ── */
    .status-bar {
      display: flex; align-items: center; gap: .8rem; flex-wrap: wrap;
      padding: .55rem 1.2rem;
      background: #fff; border-bottom: 1px solid #fce4ec;
      font-size: .78rem; color: var(--muted);
    }
    .market-pill {
      display: flex; align-items: center; gap: .35rem;
      padding: .2rem .6rem; border-radius: 20px; font-size: .73rem; font-weight: 700;
    }
    .pill-open   { background: #e8f5e9; color: #2e7d32; }
    .pill-closed { background: #fce4ec; color: var(--pink-dark); }
    .status-sep { color: #f0c0d8; }
    .update-time { margin-left: auto; }

    /* ── Tabs ── */
    .tab-bar {
      display: flex; gap: .5rem; padding: .8rem 1rem .2rem;
      max-width: 960px; margin: 0 auto;
    }
    .tab-btn {
      padding: .5rem 1.2rem; border-radius: 20px; border: 2px solid transparent;
      font-size: .88rem; font-weight: 700; cursor: pointer;
      background: #fff; color: var(--muted);
      transition: all .2s;
    }
    .tab-btn.active {
      background: linear-gradient(135deg, var(--pink), var(--pink-dark));
      color: #fff; border-color: transparent;
      box-shadow: 0 3px 12px rgba(233,30,140,.3);
    }

    /* ── Grid ── */
    main { padding: .8rem 1rem 1rem; max-width: 960px; margin: 0 auto; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 1rem;
    }

    /* ── Sector card ── */
    .sector-card {
      background: var(--card); border-radius: var(--radius);
      box-shadow: var(--shadow); border: 1.5px solid #fce4ec;
      overflow: hidden;
    }
    .sector-head {
      padding: .8rem 1.1rem;
      background: linear-gradient(135deg, #fce4ec, #fff0f5);
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid #fce4ec;
    }
    .sector-head-left { display: flex; align-items: center; gap: .5rem; }
    .sector-icon { font-size: 1.3rem; }
    .sector-name { font-weight: 700; color: var(--pink-dark); font-size: .95rem; }
    .chart-toggle-btn {
      padding: .25rem .65rem; border: 1.5px solid var(--pink-mid);
      border-radius: 8px; font-size: .73rem; font-weight: 600;
      color: var(--pink-dark); background: #fff;
      cursor: pointer; white-space: nowrap;
      transition: all .18s;
    }
    .chart-toggle-btn:hover { background: var(--pink-light); }
    .chart-toggle-btn.open  { background: var(--pink); color: #fff; border-color: var(--pink); }

    /* ── Stock rows ── */
    .stock-list { padding: .3rem 0; }
    .stock-list.two-col {
      display: grid; grid-template-columns: 1fr 1fr; padding: 0;
    }
    .stock-list.two-col .stock-row { padding: .45rem .8rem; }
    .stock-list.two-col .stock-row:nth-child(odd) { border-right: 1px solid #fdf0f5; }
    .stock-list.two-col .stock-name { font-size: .82rem; }
    .stock-list.two-col .stock-code { font-size: .65rem; }
    .stock-list.two-col .stock-price { font-size: .88rem; }
    .stock-list.two-col .stock-change { font-size: .68rem; }
    .stock-list.two-col .stock-price-wrap { min-width: 72px; }
    .stock-row {
      display: flex; align-items: center;
      padding: .6rem 1.1rem;
      border-bottom: 1px solid #fdf0f5; gap: .6rem;
    }
    .stock-row:last-child { border-bottom: none; }
    .stock-info { flex: 1; min-width: 0; }
    .stock-name { font-weight: 600; font-size: .88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stock-code { font-size: .7rem; color: var(--muted); }
    .stock-price-wrap { text-align: right; min-width: 90px; }
    .stock-price  { font-size: .97rem; font-weight: 700; }
    .stock-change {
      font-size: .74rem; font-weight: 600;
      padding: .12rem .38rem; border-radius: 5px; margin-top: .12rem;
      display: inline-block;
    }
    .up      { color: var(--up); }
    .down    { color: var(--down); }
    .up-bg   { background: #ffebee; }
    .down-bg { background: #e8f5e9; }
    .flat    { color: var(--muted); }
    .loading { color: var(--muted); font-size: .82rem; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    /* ── Chart panel ── */
    .chart-panel {
      display: none; border-top: 1.5px solid #fce4ec;
      padding: .8rem 1rem 1rem;
      background: linear-gradient(180deg, #fff8fb 0%, #fff 100%);
    }
    .chart-panel-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: .5rem;
    }
    .chart-label {
      font-size: .72rem; color: var(--muted); font-weight: 600;
      letter-spacing: .04em; text-transform: uppercase;
    }
    .chart-zoom-btn {
      padding: .22rem .65rem; border: 1.5px solid var(--pink-mid);
      border-radius: 6px; font-size: .72rem; font-weight: 600;
      color: var(--pink-dark); background: #fff;
      cursor: pointer; transition: all .15s;
    }
    .chart-zoom-btn:hover { background: var(--pink-light); }
    .chart-wrap { position: relative; height: 220px; }
    .chart-loading, .chart-error {
      display: flex; align-items: center; justify-content: center;
      height: 160px; font-size: .83rem; color: var(--muted);
    }

    /* ── Chart fullscreen modal ── */
    #chart-modal {
      display: none; position: fixed; inset: 0; z-index: 200;
      background: rgba(45, 27, 37, 0.7);
      backdrop-filter: blur(4px);
      align-items: center; justify-content: center; padding: 1rem;
    }
    #chart-modal.open { display: flex; }
    .chart-modal-card {
      background: #fff; border-radius: 16px;
      width: 100%; max-width: 1280px; max-height: 92vh;
      padding: 1.25rem 1.5rem 1.5rem;
      position: relative; display: flex; flex-direction: column;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    .chart-modal-head {
      display: flex; align-items: center; justify-content: space-between;
      padding-bottom: .8rem; border-bottom: 1.5px solid #fce4ec;
      margin-bottom: 1rem;
    }
    .chart-modal-title {
      font-size: 1.15rem; font-weight: 700; color: var(--pink-dark);
    }
    .chart-modal-sub {
      font-size: .78rem; color: var(--muted); margin-top: .15rem;
    }
    .chart-modal-close {
      background: var(--pink-light); border: none;
      width: 36px; height: 36px; border-radius: 50%;
      font-size: 1.4rem; line-height: 1; cursor: pointer;
      color: var(--pink-dark); transition: background .2s;
    }
    .chart-modal-close:hover { background: var(--pink-mid); color: #fff; }
    .chart-modal-canvas-wrap {
      flex: 1; min-height: 0; height: 70vh; position: relative;
    }
    @media (max-width: 600px) {
      .chart-modal-card { padding: .8rem .9rem 1rem; }
      .chart-modal-canvas-wrap { height: 65vh; }
      .chart-modal-title { font-size: 1rem; }
    }

    /* ── Footer note ── */
    .note {
      text-align: center; color: var(--muted); font-size: .72rem;
      padding: 1rem; margin-top: .2rem;
    }

    /* ── News section ── */
    #news-section { border-top: 2px solid #fce4ec; }
    .news-main { padding: .6rem 1rem 1.2rem; max-width: 960px; margin: 0 auto; }
    .news-hdr {
      display: flex; align-items: center; gap: .6rem;
      padding: .7rem 0 .6rem;
    }
    .news-hdr-title { font-size: .95rem; font-weight: 700; color: var(--pink-dark); }
    .news-hdr-sub   { font-size: .75rem; color: var(--muted); flex: 1; }
    .btn-news-refresh {
      padding: .3rem .7rem; border: 1.5px solid var(--pink-mid);
      border-radius: 8px; font-size: .75rem; font-weight: 600;
      color: var(--pink-dark); background: #fff; cursor: pointer;
      transition: all .15s;
    }
    .btn-news-refresh:hover { background: var(--pink-light); }
    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(255px, 1fr));
      gap: .75rem;
    }
    .news-card {
      background: #fff; border-radius: 12px;
      border: 1.5px solid #fce4ec; padding: .85rem 1rem;
      text-decoration: none; color: inherit; display: block;
      box-shadow: 0 2px 8px rgba(233,30,140,.06);
      transition: transform .15s, box-shadow .15s;
    }
    .news-card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(233,30,140,.14); }
    .news-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: .4rem; }
    .news-src  { font-size: .67rem; font-weight: 700; padding: .13rem .45rem; border-radius: 10px; }
    .news-time { font-size: .67rem; color: var(--muted); }
    .news-title {
      font-size: .83rem; font-weight: 600; line-height: 1.35; color: var(--text);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      margin-bottom: .3rem;
    }
    .news-desc {
      font-size: .73rem; color: var(--muted); line-height: 1.3;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .news-status { text-align: center; color: var(--muted); font-size: .82rem; padding: 1.5rem; }

    /* ── Language toggle ── */
    .lang-toggle {
      display: inline-flex; gap: 2px;
      background: rgba(255,255,255,.18);
      border-radius: 8px; padding: 2px;
    }
    .lang-toggle button {
      border: none; background: transparent;
      color: rgba(255,255,255,.85);
      font-size: .72rem; font-weight: 700;
      padding: .25rem .55rem; border-radius: 6px; cursor: pointer;
      letter-spacing: .03em; transition: all .15s;
    }
    .lang-toggle button.active {
      background: #fff; color: var(--pink-dark);
    }
    .lang-toggle button:not(.active):hover { background: rgba(255,255,255,.12); }

    .gate-lang {
      position: absolute; top: 1rem; right: 1rem;
      background: rgba(233,30,140,.12);
    }
    .gate-lang button { color: var(--pink-dark); }
    .gate-lang button.active { background: var(--pink); color: #fff; }
    .gate-lang button:not(.active):hover { background: rgba(233,30,140,.08); }

    @media (max-width: 520px) {
      .grid { grid-template-columns: 1fr; }
      header { padding: .75rem 1rem; }
      .update-time { display: none; }
      .news-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- ── Gate ── -->
<div id="gate">
  <div class="lang-toggle gate-lang">
    <button data-lang="zh" onclick="setLang('zh')">中</button>
    <button data-lang="en" onclick="setLang('en')">EN</button>
    <button data-lang="de" onclick="setLang('de')">DE</button>
  </div>
  <div class="gate-card">
    <div class="gate-icon">🌸</div>
    <div class="gate-title" data-i18n="gate_title">投资看板</div>
    <div class="gate-sub" data-i18n="gate_sub">请输入密码进入</div>
    <input id="pwd-input" class="gate-input" type="password"
           maxlength="4" placeholder="••••" autocomplete="off" />
    <div class="gate-err" id="gate-err"></div>
    <button class="gate-btn" data-i18n="gate_btn" onclick="checkPwd()">进 入</button>
  </div>
</div>

<!-- ── App ── -->
<div id="app">
  <header>
    <div class="header-left">
      <span>🌸</span>
      <span class="header-title" data-i18n="title">我的投资看板</span>
    </div>
    <div class="header-right">
      <div class="lang-toggle">
        <button data-lang="zh" onclick="setLang('zh')">中</button>
        <button data-lang="en" onclick="setLang('en')">EN</button>
        <button data-lang="de" onclick="setLang('de')">DE</button>
      </div>
      <button class="btn-sm btn-refresh" data-i18n="refresh" onclick="loadAll()">⟳ 刷新</button>
      <button class="btn-sm btn-logout" data-i18n="logout" onclick="logout()">退出</button>
    </div>
  </header>

  <div class="status-bar">
    <span class="market-pill pill-closed" id="badge-cn">🇨🇳 A股 休市</span>
    <span class="status-sep">|</span>
    <span class="market-pill pill-closed" id="badge-us">🇺🇸 美股 休市</span>
    <span class="update-time" id="update-time" data-i18n="loading">加载中…</span>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" id="tab-cn-btn"  data-i18n="tab_cn"  onclick="switchTab('cn')">🇨🇳 中国A股</button>
    <button class="tab-btn"        id="tab-us-btn"  data-i18n="tab_us"  onclick="switchTab('us')">🇺🇸 美股</button>
    <button class="tab-btn"        id="tab-idx-btn" data-i18n="tab_idx" onclick="switchTab('idx')">🌍 全球指数</button>
  </div>

  <div id="tab-cn">
    <main><div class="grid" id="grid-cn"></div></main>
  </div>
  <div id="tab-us" style="display:none">
    <main><div class="grid" id="grid-us"></div></main>
  </div>
  <div id="tab-idx" style="display:none">
    <main><div class="grid" id="grid-idx"></div></main>
  </div>

  <!-- ── Financial News ── -->
  <div id="news-section">
    <div class="news-main">
      <div class="news-hdr">
        <span class="news-hdr-title" data-i18n="news_title">📰 财经资讯</span>
        <span class="news-hdr-sub" data-i18n="news_sub">突发 · 评级 · 政策 · 实时</span>
        <button class="btn-news-refresh" data-i18n="news_refresh" onclick="loadNews()">⟳ 刷新</button>
      </div>
      <div class="news-grid" id="news-grid">
        <div class="news-status" data-i18n="news_loading">资讯加载中…</div>
      </div>
    </div>
  </div>

  <div class="note" data-i18n="note">数据来源：腾讯财经 / Yahoo Finance · 走势图为每周收盘价累计涨跌幅 · 仅供参考，不构成投资建议</div>
</div>

<!-- ── Chart fullscreen modal ── -->
<div id="chart-modal" onclick="if(event.target===this) closeChartModal()">
  <div class="chart-modal-card">
    <div class="chart-modal-head">
      <div>
        <div class="chart-modal-title" id="chart-modal-title"></div>
        <div class="chart-modal-sub" id="chart-modal-sub"></div>
      </div>
      <button class="chart-modal-close" onclick="closeChartModal()" aria-label="Close">×</button>
    </div>
    <div class="chart-modal-canvas-wrap"><canvas id="chart-modal-canvas"></canvas></div>
  </div>
</div>

<script>
/* ══════════════════════════════════════
   I18N
══════════════════════════════════════ */
const I18N = {
  zh: {
    title:        '我的投资看板',

    logout:       '退出',
    loading:      '加载中…',
    no_data:      '暂无数据',
    market_cn:    'A股',
    market_us:    '美股',
    open:         '开盘中',
    closed:       '休市',
    updated:      '更新于 ',
    tab_cn:       '🇨🇳 中国A股',
    tab_us:       '🇺🇸 美股',
    tab_idx:      '🌍 全球指数',
    chart_btn:    '📈 走势图',
    chart_close:  '📈 收起',
    chart_zoom:   '🔍 放大',
    chart_loading:'走势图加载中…',

    chart_label:  yrs => `近${yrs}年累计涨跌幅（%，以起点收盘价为基准）`,
    news_title:   '📰 财经资讯',
    news_sub:     '突发 · 评级 · 政策 · 实时',
    news_refresh: '⟳ 刷新',
    news_loading: '资讯加载中…',
    news_empty:   '⚠ 暂无资讯，请稍后刷新',
    news_now:     '刚刚',
    news_min:     m => `${m}分钟前`,
    news_hour:    h => `${h}小时前`,
    note:         '数据来源：腾讯财经 / Yahoo Finance · 走势图为每周收盘价累计涨跌幅 · 仅供参考，不构成投资建议',
    gate_title:   '投资看板',
    gate_sub:     '请输入密码进入',
    gate_btn:     '进 入',

  },
  en: {
    title:        'Investment Dashboard',
    refresh:      '⟳ Refresh',
    logout:       'Sign out',
    loading:      'Loading…',
    no_data:      'No data',
    market_cn:    'A-Shares',
    market_us:    'US',

    closed:       'Closed',
    updated:      'Updated ',
    tab_cn:       '🇨🇳 China A-Shares',
    tab_us:       '🇺🇸 US Stocks',
    tab_idx:      '🌍 Global Indices',
    chart_btn:    '📈 Chart',
    chart_close:  '📈 Hide',
    chart_zoom:   '🔍 Enlarge',
    chart_loading:'Loading chart…',
    chart_error:  '⚠️ Failed to load data — please retry',
    chart_label:  yrs => `Cumulative return last ${yrs} years (%, base = first close)`,
    news_title:   '📰 Market News',
    news_sub:     'Bulletins · Ratings · Policy · Real-time',
    news_refresh: '⟳ Refresh',
    news_loading: 'Loading news…',
    news_empty:   '⚠ No news available, please refresh',
    news_now:     'just now',

let lang = localStorage.getItem('invest_lang') || 'zh';

function t(key, ...args) {
  const v = (I18N[lang] && I18N[lang][key]) ?? I18N.zh[key] ?? key;
  return typeof v === 'function' ? v(...args) : v;
}

function sectorName(s) {
  if (lang === 'zh') return s.name;
  return SECTOR_I18N[s.name]?.[lang] || s.name;
}

function setLang(l) {
  if (!I18N[l]) return;
  lang = l;
  localStorage.setItem('invest_lang', l);
  applyI18n();
  /* Re-render dynamic content (sector names, badges, news) */
  if (document.getElementById('app').style.display !== 'none') {
    updateMarketBadges();
    loadAll();
    loadNews();
  }
}

function applyI18n() {
  /* Static text: any element with [data-i18n] gets its textContent updated */
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
  /* Highlight active language button */
  document.querySelectorAll('.lang-toggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === lang);
  });
  /* Update <html lang> + document title */
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
  document.title = '🌸 ' + t('gate_title');
}

function isCNOpen() {
  const bj = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Shanghai' }));
  if (bj.getDay() === 0 || bj.getDay() === 6) return false;
  const m = bj.getHours() * 60 + bj.getMinutes();
  return (m >= 570 && m <= 690) || (m >= 780 && m <= 900);
}
function isUSOpen() {
  const et = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/New_York' }));
  if (et.getDay() === 0 || et.getDay() === 6) return false;
  const m = et.getHours() * 60 + et.getMinutes();
  return m >= 570 && m < 960;
}
function updateMarketBadges() {
  const cn = isCNOpen(), us = isUSOpen();
  const bc = document.getElementById('badge-cn');
  const bu = document.getElementById('badge-us');

/* ══════════════════════════════════════
   FETCH QUOTES
   Primary: Tencent qt.gtimg.cn (CORS-enabled, no proxy needed)
   Fallback: Yahoo Finance v8 chart via allorigins.win
══════════════════════════════════════ */

/* Map a Yahoo symbol to its Tencent equivalent. Returns null if no mapping. */
function toTencentSymbol(yh) {
  if (!yh) return null;
  /* Explicit overrides for indices / commodities / forex */
  const FIXED = {
    '^GSPC': 'usINX',  '^IXIC': 'usIXIC',  '^DJI': 'usDJI',
    '^HSI': 'hkHSI',   '^HSTECH': 'hkHSTECH',
    'GC=F': 'hf_GC',   'SI=F': 'hf_SI',
    'CL=F': 'hf_CL',   'HG=F': 'hf_HG',
    'EURUSD=X': 'fxEURUSD', 'GBPUSD=X': 'fxGBPUSD',
    'USDJPY=X': 'fxUSDJPY', 'USDCNY=X': 'fxUSDCNY',
    'USDCHF=X': 'fxUSDCHF',
  };
  if (FIXED[yh]) return FIXED[yh];

  /* Mainland China A-shares */
  if (yh.endsWith('.SS')) return 'sh' + yh.slice(0, -3);
  if (yh.endsWith('.SZ')) return 'sz' + yh.slice(0, -3);
  /* Hong Kong */
  if (yh.endsWith('.HK')) return 'hk' + yh.slice(0, -3).padStart(5, '0');
  /* US plain ticker (allow dots/hyphens like BRK-B, BRK.A) */
  if (/^[A-Z][A-Z0-9.\-]*$/.test(yh)) return 'us' + yh.replace('-', '.');

  return null;
}

/* Parse Tencent text response. mapping = [{yh, tc}, ...] */
function parseTencent(text, mapping) {
  const out = [];
  for (const m of mapping) {
    const re = new RegExp('v_' + m.tc.replace(/[.\\-]/g, '\\$&') + '="([^"]*)"');
    const mt = text.match(re);
    if (!mt || !mt[1]) continue;
    const raw = mt[1];
    let price, pct;
    if (m.tc.startsWith('hf_')) {
      /* Commodities: comma-separated, [price, pct, ...] */
      const f = raw.split(',');
      price = parseFloat(f[0]);
      pct   = parseFloat(f[1]);
    } else if (m.tc.startsWith('fx')) {
      /* Forex: tilde-separated, price@3, pct@13 */
      const f = raw.split('~');
      price = parseFloat(f[3]);
      pct   = parseFloat(f[13]);
    } else {
      /* Stocks/indices: tilde-separated, price@3, pct@32 */
      const f = raw.split('~');
      price = parseFloat(f[3]);
      pct   = parseFloat(f[32]);
      if ((isNaN(pct) || pct === 0)) {
        const prev = parseFloat(f[4]);
        if (!isNaN(prev) && prev > 0) pct = ((price - prev) / prev) * 100;
      }
    }
    if (!isNaN(price) && price > 0) out.push({ symbol: m.yh, price, pct: pct || 0 });
  }
  return out;
}

async function fetchTencent(symbols) {
  const mapping = symbols.map(yh => ({ yh, tc: toTencentSymbol(yh) })).filter(m => m.tc);
  if (!mapping.length) return [];
  const BATCH = 60;
  const all = [];
  for (let i = 0; i < mapping.length; i += BATCH) {
    const chunk = mapping.slice(i, i + BATCH);
    try {
      const res = await fetch(`https://qt.gtimg.cn/q=${chunk.map(m => m.tc).join(',')}`,
                              { signal: AbortSignal.timeout(10000) });
      if (!res.ok) continue;
      const text = await res.text();
      all.push(...parseTencent(text, chunk));
    } catch {}
  }
  return all;
}

/* Yahoo fallback for symbols Tencent can't serve (DAX, FTSE, ^TNX, EURUSD=X, …) */
async function fetchYahooOne(symbol) {
  const url = `https://query2.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(symbol)}?range=2d&interval=1d`;
  const eps = [
    `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
    `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
    url,
  ];
  for (const ep of eps) {
    try {
      const res = await fetch(ep, { signal: AbortSignal.timeout(12000) });
      if (!res.ok) continue;
      let d = await res.json();
      if (d.contents) d = JSON.parse(d.contents);
      const meta = d?.chart?.result?.[0]?.meta;
      if (meta?.regularMarketPrice != null)
        return { symbol, price: meta.regularMarketPrice, pct: meta.regularMarketChangePercent ?? 0 };
    } catch {}
  }
  return null;
}

async function fetchQuotes(symbols) {
  const tencent = await fetchTencent(symbols);
  const got = new Set(tencent.map(r => r.symbol));
  const missing = symbols.filter(s => !got.has(s));
  if (!missing.length) return tencent;
  const yahoo = await Promise.all(missing.map(fetchYahooOne));
  return [...tencent, ...yahoo.filter(Boolean)];
}

function renderGrid(market, quoteMap) {
  const sectors = market === 'cn' ? CN_SECTORS : market === 'us' ? US_SECTORS : INDEX_SECTORS;
  const currency = market === 'cn' ? '¥' : market === 'us' ? '$' : '';
  const fmtPrice = (p, sec) => {
    if (sec?.priceFmt) return sec.priceFmt(p);
    if (market === 'idx') return p.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    return currency + p.toFixed(2);
  };
  const gridEl = document.getElementById('grid-' + market);

  gridEl.innerHTML = sectors.map((s, idx) => {
    const rows = s.stocks.map(st => {
      const q = quoteMap?.[st.code];
      if (!q) return `
        <div class="stock-row">
          <div class="stock-info">
            <div class="stock-name">${st.label}</div>
            <div class="stock-code">${st.display}</div>
          </div>
          <div class="stock-price-wrap">
            <span class="flat" style="font-size:.8rem">${quoteMap ? t('no_data') : `<span class="loading">${t('loading')}</span>`}</span>
          </div>
        </div>`;
      const up = q.pct >= 0;
      return `
        <div class="stock-row">
          <div class="stock-info">
            <div class="stock-name">${st.label}</div>
            <div class="stock-code">${st.display}</div>
          </div>
          <div class="stock-price-wrap">
            <div class="stock-price ${up ? 'up' : 'down'}">${fmtPrice(q.price, s)}</div>
            <span class="stock-change ${up ? 'up up-bg' : 'down down-bg'}">
              ${up ? '▲' : '▼'} ${Math.abs(q.pct).toFixed(2)}%
            </span>
          </div>
        </div>`;
    }).join('');

    return `
      <div class="sector-card">
        <div class="sector-head">
          <div class="sector-head-left">
            <span class="sector-icon">${s.icon}</span>
            <span class="sector-name">${sectorName(s)}</span>
          </div>
          <button class="chart-toggle-btn" id="chartbtn-${market}-${idx}"
                  onclick="toggleChart('${market}',${idx})">${t('chart_btn')}</button>
        </div>
        <div class="stock-list${s.stocks.length >= 10 ? ' two-col' : ''}">${rows}</div>
        <div class="chart-panel" id="chart-panel-${market}-${idx}">
          <div class="chart-loading">${t('chart_loading')}</div>
        </div>
      </div>`;
  }).join('');
}

async function loadMarket(market) {
  renderGrid(market, null);
  const sectors = market === 'cn' ? CN_SECTORS : market === 'us' ? US_SECTORS : INDEX_SECTORS;
  const symbols = sectors.flatMap(s => s.stocks.map(st => st.code));
  const results = await fetchQuotes(symbols);
  const map = {};
  if (results) results.forEach(q => { map[q.symbol] = { price: q.price, pct: q.pct }; });
  renderGrid(market, map);

  // Re-open any previously open charts
  Object.keys(chartLoaded).forEach(key => {
    if (key.startsWith(market + '-') && chartLoaded[key]) {
      const idx = parseInt(key.split('-')[1]);
      const panel = document.getElementById(`chart-panel-${market}-${idx}`);
      if (panel) panel.style.display = 'block';
    }
  });
}

/* ══════════════════════════════════════
   CHART: FETCH HISTORY + DRAW
══════════════════════════════════════ */
const chartInstances = {};
const chartLoaded    = {};

async function fetchHistory(symbol, range = '2y') {
  const url = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(symbol)}?interval=1wk&range=${range}`;
  const endpoints = [
    url,
    `https://corsproxy.io/?${encodeURIComponent(url)}`,
    `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
  ];
  for (const ep of endpoints) {
    try {
      const res = await fetch(ep, { signal: AbortSignal.timeout(12000) });
      if (!res.ok) continue;
      let data = await res.json();
      if (data.contents) data = JSON.parse(data.contents);
      const result = data?.chart?.result?.[0];
      if (!result?.timestamp) continue;
      const closes = result.indicators.quote[0].close;
      const points = result.timestamp
        .map((ts, i) => ({ date: new Date(ts * 1000), price: closes[i] }))
        .filter(p => p.price != null);
      if (points.length > 0) return points;
    } catch {}
  }
  return null;
}

const zeroLinePlugin = {
  id: 'zeroline',
  beforeDraw(chart) {
    const { ctx, scales: { y } } = chart;
    if (!y) return;
    const zero = y.getPixelForValue(0);
    if (zero < chart.chartArea.top || zero > chart.chartArea.bottom) return;
    ctx.save();
    ctx.strokeStyle = 'rgba(233,30,140,0.35)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([5, 4]);
    ctx.beginPath();
    ctx.moveTo(chart.chartArea.left, zero);
    ctx.lineTo(chart.chartArea.right, zero);
    ctx.stroke();
    ctx.restore();
  }
};

async function toggleChart(market, idx) {
  const panel  = document.getElementById(`chart-panel-${market}-${idx}`);
  const btn    = document.getElementById(`chartbtn-${market}-${idx}`);
  const key    = `${market}-${idx}`;

  if (panel.style.display === 'block') {
    panel.style.display = 'none';
    btn.textContent = t('chart_btn');
    btn.classList.remove('open');
    return;
  }

  panel.style.display = 'block';
  btn.textContent = t('chart_close');
  btn.classList.add('open');

  if (chartLoaded[key]) return;

  panel.innerHTML = `<div class="chart-loading">${t('chart_loading')}</div>`;

  const sector = market === 'cn' ? CN_SECTORS[idx] : market === 'us' ? US_SECTORS[idx] : INDEX_SECTORS[idx];
  const range  = sector.range || '2y';
  const histories = await Promise.all(sector.stocks.map(s => fetchHistory(s.code, range)));

  const datasets = sector.stocks.map((stock, i) => {
    const h = histories[i];
    if (!h || h.length === 0) return null;
    const base = h[0].price;
    return {
      label: stock.label,
      data: h.map(p => ({ x: p.date.getTime(), y: +((p.price - base) / base * 100).toFixed(2) })),
      borderColor: sector.colors[i % sector.colors.length],
      backgroundColor: sector.colors[i % sector.colors.length] + '18',
      borderWidth: 2,
      pointRadius: 0,
      pointHoverRadius: 4,
      fill: false,
      tension: 0.3,
    };
  }).filter(Boolean);

  if (datasets.length === 0) {
    panel.innerHTML = `<div class="chart-error">${t('chart_error')}</div>`;
    return;
  }

  const canvasId = `chart-${market}-${idx}`;
  const yrs = range === '3y' ? '3' : '2';
  panel.innerHTML = `
    <div class="chart-panel-head">
      <div class="chart-label">${t('chart_label', yrs)}</div>
      <button class="chart-zoom-btn" onclick="openChartModal('${market}',${idx})">${t('chart_zoom')}</button>
    </div>
    <div class="chart-wrap"><canvas id="${canvasId}"></canvas></div>`;

  if (chartInstances[key]) chartInstances[key].destroy();

  chartInstances[key] = new Chart(document.getElementById(canvasId), {
    type: 'line',
    data: { datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      scales: {
        x: {
          type: 'time',
          time: { unit: 'month', displayFormats: { month: 'yy/MM' } },
          grid: { color: '#fce4ec50' },
          ticks: { color: '#9e6e83', font: { size: 10 }, maxTicksLimit: 13 }
        },
        y: {
          grid: { color: '#fce4ec50' },
          ticks: {
            color: '#9e6e83', font: { size: 10 },
            callback: v => (v >= 0 ? '+' : '') + v.toFixed(0) + '%'
          }
        }
      },
      plugins: {
        legend: {
          labels: { color: '#2d1b25', font: { size: 11 }, boxWidth: 12, padding: 10 }
        },
        tooltip: {
          callbacks: {
            title: items => new Date(items[0].parsed.x).toLocaleDateString(
              lang === 'zh' ? 'zh-CN' : (lang === 'de' ? 'de-DE' : 'en-US'),
              { year: 'numeric', month: 'short', day: 'numeric' }),
            label: ctx => ` ${ctx.dataset.label}：${ctx.parsed.y >= 0 ? '+' : ''}${ctx.parsed.y.toFixed(2)}%`
          }
        }
      }
    },
    plugins: [zeroLinePlugin]
  });

  chartLoaded[key] = true;
}

/* ══════════════════════════════════════
   CHART FULLSCREEN MODAL
══════════════════════════════════════ */
let modalChart = null;

function openChartModal(market, idx) {
  const key = `${market}-${idx}`;
  const src = chartInstances[key];
  if (!src) return;
  const sector = market === 'cn' ? CN_SECTORS[idx] : market === 'us' ? US_SECTORS[idx] : INDEX_SECTORS[idx];
  const range  = sector.range || '2y';
  const yrs    = range === '3y' ? '3' : '2';

  document.getElementById('chart-modal-title').textContent = `${sector.icon}  ${sectorName(sector)}`;
  document.getElementById('chart-modal-sub').textContent   = t('chart_label', yrs);
  document.getElementById('chart-modal').classList.add('open');

  /* Re-create chart in the modal canvas using the same data */
  if (modalChart) modalChart.destroy();
  const datasets = src.data.datasets.map(ds => ({
    ...ds,
    borderWidth: 2.4,
    pointHoverRadius: 5,
  }));
  modalChart = new Chart(document.getElementById('chart-modal-canvas'), {
    type: 'line',
    data: { datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      scales: {
        x: {
          type: 'time',
          time: { unit: 'month', displayFormats: { month: 'yy/MM' } },
          grid: { color: '#fce4ec80' },
          ticks: { color: '#7a4d63', font: { size: 11 }, maxTicksLimit: 18 }
        },
        y: {
          grid: { color: '#fce4ec80' },
          ticks: {
            color: '#7a4d63', font: { size: 11 },
            callback: v => (v >= 0 ? '+' : '') + v.toFixed(0) + '%'
          }
        }
      },
      plugins: {
        legend: {
          position: 'bottom',
          labels: { color: '#2d1b25', font: { size: 12 }, boxWidth: 14, padding: 12 }
        },
        tooltip: {
          callbacks: {
            title: items => new Date(items[0].parsed.x).toLocaleDateString(
              lang === 'zh' ? 'zh-CN' : (lang === 'de' ? 'de-DE' : 'en-US'),
              { year: 'numeric', month: 'short', day: 'numeric' }),
            label: ctx => ` ${ctx.dataset.label}：${ctx.parsed.y >= 0 ? '+' : ''}${ctx.parsed.y.toFixed(2)}%`
          }
        }
      }
    },
    plugins: [zeroLinePlugin]
  });
}

function closeChartModal() {
  document.getElementById('chart-modal').classList.remove('open');
  if (modalChart) { modalChart.destroy(); modalChart = null; }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('chart-modal').classList.contains('open')) closeChartModal();
});

/* ══════════════════════════════════════
   NEWS
══════════════════════════════════════ */
async function fetchNewsSource(src) {
  /* rss2json free tier dropped the &count param — use default (10 items) and slice client-side */
  const api = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(src.rss)}`;
  try {
    const res = await fetch(api, { signal: AbortSignal.timeout(9000) });
    if (!res.ok) return [];
    const data = await res.json();
    if (data.status !== 'ok') return [];
    return (data.items || []).slice(0, 6).map(item => ({ ...item, _src: src }));
  } catch { return []; }
}

async function loadNews() {
  const grid = document.getElementById('news-grid');
  grid.innerHTML = `<div class="news-status">${t('news_loading')}</div>`;

  const results = await Promise.all(NEWS_SOURCES.map(fetchNewsSource));
  const all = results.flat().sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate)).slice(0, 12);

  if (!all.length) {
    grid.innerHTML = `<div class="news-status">${t('news_empty')}</div>`;
    return;
  }

  const now = new Date();
  const dateLocale = lang === 'zh' ? 'zh-CN' : (lang === 'de' ? 'de-DE' : 'en-US');
  grid.innerHTML = all.map(item => {
    const pub  = new Date(item.pubDate);
    const diff = Math.floor((now - pub) / 60000);
    const age  = diff < 1 ? t('news_now') : diff < 60 ? t('news_min', diff)
               : diff < 1440 ? t('news_hour', Math.floor(diff/60))
               : pub.toLocaleDateString(dateLocale, { month:'short', day:'numeric' });
    const desc = item.description
      ? item.description.replace(/<[^>]*>/g,'').trim().slice(0, 90) + '…' : '';
    const s = item._src;
    return `
      <a class="news-card" href="${item.link}" target="_blank" rel="noopener noreferrer">
        <div class="news-meta">
          <span class="news-src" style="color:${s.color};background:${s.bg}">${s.label}</span>
          <span class="news-time">${age}</span>
        </div>
        <div class="news-title">${item.title}</div>
        ${desc ? `<div class="news-desc">${desc}</div>` : ''}
      </a>`;
  }).join('');
}

/* ══════════════════════════════════════
   INIT + AUTO-REFRESH
══════════════════════════════════════ */
function init() {
  loadAll();
  loadNews();
}

// Auto-refresh every 5 min when any market is open
setInterval(() => {
  if (sessionStorage.getItem(KEY) !== '1') return;
  if (isCNOpen() || isUSOpen()) loadAll();
}, 5 * 60 * 1000);

/* Apply chosen language to all static UI text on first load */
applyI18n();

// Auto-enter if already authenticated
if (sessionStorage.getItem(KEY) === '1') {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  init();
}
</script>
